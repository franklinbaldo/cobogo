name: Knowledge

on:
  push:
    branches: [ main ]
    paths:
      - 'knowledge/**'
      - '.github/workflows/knowledge.yml'
  pull_request:
    paths:
      - 'knowledge/**'
      - '.github/workflows/knowledge.yml'

permissions:
  contents: read

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cobogó knowledge with okf-parser v0.42.8
        uses: franklinbaldo/okf-parser@689f260381ad533b6ed6fe20d455e6ebc38724f6 # v0.42.8
        with:
          path: knowledge

      - name: Produce semantic evidence from the validated bundle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/cobogo-okf"
          mkdir -p "$evidence"

          parser=(uvx --from okf-parser==0.42.8 okf-parser)
          "${parser[@]}" --version | tee "$evidence/version.txt"
          "${parser[@]}" check knowledge \
            --classify \
            --relational-schema okf.schema.sql \
            | tee "$evidence/check.json"
          "${parser[@]}" check knowledge \
            --require-spec '.okf/specs/{slug}.md' \
            --normative-spec \
            > "$evidence/spec-check.json"
          "${parser[@]}" init knowledge \
            --spec-template '.okf/specs/{slug}.md' \
            --infer-schema \
            > "$evidence/type-spec-plan.json"
          "${parser[@]}" inventory knowledge --digests > "$evidence/inventory.json"
          "${parser[@]}" graph knowledge > "$evidence/graph.json"
          "${parser[@]}" schema knowledge --format json --infer-types > "$evidence/inferred-schema.json"
          "${parser[@]}" duckdb knowledge "$evidence/knowledge.duckdb"

      - name: Preserve OKF projections for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobogo-okf-projections
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/cobogo-okf/version.txt
            ${{ runner.temp }}/cobogo-okf/check.json
            ${{ runner.temp }}/cobogo-okf/spec-check.json
            ${{ runner.temp }}/cobogo-okf/type-spec-plan.json
            ${{ runner.temp }}/cobogo-okf/inventory.json
            ${{ runner.temp }}/cobogo-okf/graph.json
            ${{ runner.temp }}/cobogo-okf/inferred-schema.json
            ${{ runner.temp }}/cobogo-okf/knowledge.duckdb
