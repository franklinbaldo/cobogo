name: Laboratório OKF

on:
  pull_request:
    paths:
      - "knowledge/**"
      - "skills/experiments/**"
      - "src/pages/laboratorio.astro"
      - ".github/workflows/lab-okf.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - "skills/experiments/**"
      - "src/pages/laboratorio.astro"
      - ".github/workflows/lab-okf.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cobogó
        uses: actions/checkout@v4

      - name: Checkout okf-parser
        uses: actions/checkout@v4
        with:
          repository: franklinbaldo/okf-parser
          ref: v0.45.6
          path: .okf-parser

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.21"

      - name: Validate laboratory contracts
        run: >-
          uv run --project .okf-parser --frozen okf-parser check knowledge
          --relational-schema okf.schema.sql

      - name: Ensure every experiment skill exists
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          failures = []
          for experiment in Path("knowledge/experiments").glob("*.md"):
              text = experiment.read_text()
              match = re.search(r"^skill_path:\s*(.+)$", text, re.MULTILINE)
              if not match:
                  failures.append(f"{experiment}: missing skill_path")
                  continue
              path = Path(match.group(1).strip().strip('"'))
              if not path.is_file():
                  failures.append(f"{experiment}: missing generated skill {path}")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Build public specimen
        run: |
          npm ci
          npm run build
