name: Verify Cobogó agent skill installation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install with canonical skills CLI
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          npx --yes skills add franklinbaldo/skills \
            --skill brazilian-web-design \
            --skill cobogo-design-review \
            --skill cobogo-consumer-synergy \
            --agent claude-code \
            --copy \
            --yes

      - name: Inspect exact CLI output
        run: |
          echo '--- skills-lock.json ---'
          if test -f skills-lock.json; then cat skills-lock.json; else echo '(none)'; fi
          echo '--- project skill files ---'
          find .agents .claude -maxdepth 5 \( -type f -o -type l \) -print 2>/dev/null | sort || true

      - name: Stage exact CLI output for artifact
        run: |
          mkdir -p /tmp/cobogo-skill-install
          test ! -f skills-lock.json || cp skills-lock.json /tmp/cobogo-skill-install/
          test ! -d .agents || cp -a .agents /tmp/cobogo-skill-install/
          test ! -d .claude || cp -a .claude /tmp/cobogo-skill-install/
          test -n "$(find /tmp/cobogo-skill-install -mindepth 1 -print -quit)" || {
            echo 'CLI produced no project-scope output; failing closed.'
            exit 1
          }

      - name: Upload canonical CLI output
        uses: actions/upload-artifact@v4
        with:
          name: cobogo-agent-skills-cli-output
          path: /tmp/cobogo-skill-install
          include-hidden-files: true
