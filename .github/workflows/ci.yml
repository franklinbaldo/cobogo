name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Rendered evidence contract
        run: npm run test:rendered-evidence
      - name: RoundReport clarity contract
        run: npm run test:round-report-clarity
      - name: Public core contract
        run: npm run test:public-core-contract
      - name: Astro check
        run: npx astro check
      - name: Build
        run: npm run build
