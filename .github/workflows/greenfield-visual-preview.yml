name: Greenfield visual preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start branch preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cobogo-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/cobogo/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cobogo-preview.log
          exit 1
      - name: Capture greenfield routes
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync } from 'node:fs';
          import { chromium } from 'playwright';
          mkdirSync('artifacts/greenfield', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          for (const route of [
            '',
            'grammar/',
            'core/',
            'patterns/',
            'consumers/',
            'knowledge/',
            'legacy-home/',
          ]) {
            await page.goto(`http://127.0.0.1:4321/cobogo/${route}`, { waitUntil: 'networkidle' });
            const name = route ? route.replaceAll('/', '-').replace(/-$/, '') : 'home';
            await page.screenshot({ path: `artifacts/greenfield/${name}.png`, fullPage: true });
          }
          await browser.close();
          NODE
      - name: Reduced-motion conformance
        run: |
          node scripts/check-reduced-motion.mjs http://127.0.0.1:4321/cobogo \
            / grammar/ core/ patterns/ consumers/ knowledge/ docs/
      - uses: actions/upload-artifact@v4
        with:
          name: cobogo-greenfield-preview
          path: artifacts/greenfield
