name: Greenfield visual preview

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SYNTHETIC_REF: ${{ github.event.pull_request && github.sha || '' }}
      EVIDENCE_PHASE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start branch preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cobogo-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/cobogo/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cobogo-preview.log
          exit 1
      - name: Capture public routes in desktop and mobile
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { chromium } from 'playwright';

          const routes = ['', 'grammar/', 'core/', 'patterns/', 'consumers/', 'knowledge/'];
          const viewports = [
            { name: 'desktop', width: 1600, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const root = 'artifacts/greenfield';
          mkdirSync(root, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const observations = [];
          const failures = [];

          for (const viewport of viewports) {
            const page = await browser.newPage({
              viewport: { width: viewport.width, height: viewport.height },
              deviceScaleFactor: 1,
            });
            for (const route of routes) {
              const response = await page.goto(`http://127.0.0.1:4321/cobogo/${route}`, {
                waitUntil: 'networkidle',
              });
              const status = response?.status() ?? 0;
              const dimensions = await page.evaluate(() => ({
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
              }));
              const name = route ? route.replaceAll('/', '-').replace(/-$/, '') : 'home';
              const image = `${viewport.name}-${name}.png`;
              await page.screenshot({ path: `${root}/${image}`, fullPage: true });
              observations.push({
                route: `/cobogo/${route}`,
                viewport: { width: viewport.width, height: viewport.height },
                status,
                document_width: dimensions.documentWidth,
                body_width: dimensions.bodyWidth,
                image,
              });
              if (status !== 200) failures.push(`${route || '/'} returned HTTP ${status}`);
              if (viewport.name === 'mobile' && dimensions.documentWidth > viewport.width) {
                failures.push(
                  `${route || '/'} is ${dimensions.documentWidth}px wide in a ${viewport.width}px viewport`,
                );
              }
            }
            await page.close();
          }
          await browser.close();

          writeFileSync(`${root}/evidence.json`, JSON.stringify({
            evaluated_sha: process.env.EVALUATED_SHA,
            synthetic_ref: process.env.SYNTHETIC_REF || null,
            phase: process.env.EVIDENCE_PHASE,
            observations,
            failures,
          }, null, 2));

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          NODE
      - name: Reduced-motion conformance
        run: |
          node scripts/check-reduced-motion.mjs http://127.0.0.1:4321/cobogo \
            / grammar/ core/ patterns/ consumers/ knowledge/ docs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobogo-greenfield-preview-${{ env.EVALUATED_SHA }}
          path: artifacts/greenfield
