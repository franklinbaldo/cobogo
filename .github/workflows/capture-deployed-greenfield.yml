name: Capture deployed greenfield

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Capture deployed Pages
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { chromium } from 'playwright';
          const base = 'https://franklinbaldo.github.io/cobogo/';
          mkdirSync('artifacts/deployed', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          for (const [route, name] of [
            ['', 'home'],
            ['grammar/', 'grammar'],
            ['core/', 'core'],
            ['patterns/', 'patterns'],
            ['consumers/', 'consumers'],
            ['knowledge/', 'knowledge'],
            ['legacy-home/', 'legacy-home'],
          ]) {
            const response = await page.goto(base + route, { waitUntil: 'networkidle', timeout: 120000 });
            if (!response || !response.ok()) throw new Error(`${route || '/'} -> ${response?.status()}`);
            await page.screenshot({ path: `artifacts/deployed/${name}.png`, fullPage: true });
          }
          writeFileSync('artifacts/deployed/metadata.json', JSON.stringify({
            captured_at: new Date().toISOString(),
            base,
            viewport: { width: 1600, height: 1000 },
          }, null, 2));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cobogo-deployed-greenfield
          path: artifacts/deployed
