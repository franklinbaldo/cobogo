name: Wisk round

# Ephemeral executor for the current repository round.
on:
  push:
    branches:
      - wisk/round-20260907-01

permissions:
  contents: write

jobs:
  complete:
    if: contains(github.event.head_commit.message, 'run-wisk-round-completion')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Sync project environment
        run: uv sync --group dev
      - name: Bootstrap Wisk idempotently
        run: uv run wisk init .
      - name: Complete current Wisk run
        run: |
          set -euxo pipefail
          RUN='runs/20260907T150029Z-fa-a-o-melhor-avan-o-poss-vel-neste-reposit-rio'
          GOAL='run-goals/20260907t150029z-fa-a-o-melhor-avan-o-poss-vel-n/goal-wisk-local-visual-contract'
          uv run wisk run reading "$RUN" run-readings/active-handoffs active-handoffs 'Active handoffs' '.wisk/knowledge/experiences/handoffs' 'No active handoffs were present when the round started.'
          uv run wisk run reading "$RUN" run-readings/active-skills active-skills 'Active local skills and contracts' 'knowledge/wikiskill/session-types/visual-explorer.md' 'Cobogó already had a visual-explorer SessionType and visual-exploration RunSpec, but they were outside the Wisk local namespace and therefore invisible to Wisk selection.'
          uv run wisk run goal "$RUN" "$GOAL" task-advance 'Make the existing Cobogó visual laboratory specialization visible to Wisk without duplicating its policy in the scheduler prompt.' 'The first Wisk start selected standard-experience because the repository-specific visual contracts were not under .wisk/knowledge/local/.' 'After migration, Wisk validates the local bundle and the next eligible Experience specialization is session-types/visual-explorer.'
          uv run wisk run decision "$RUN" run-decisions/port-visual-specialization 'How should Cobogó preserve its visual-lab contract under Wisk?' 'Port the current visual SessionType and RunSpec into .wisk/knowledge/local/, inheriting canonical Experience while keeping the domain requirements local.' 'This preserves the existing Cobogó source contract while adopting Wisk composition instead of rebuilding orchestration in the scheduler prompt.' --goal "$GOAL"
          uv run wisk check "$RUN" > .wisk-check-before-close.json || true
          uv run wisk run evidence "$RUN" run-evidence/local-specialization execution '.wisk/knowledge/local/' 'Added Wisk-local visual-explorer SessionType and visual-exploration RunSpec adapted from the repository current contracts.' --goal "$GOAL"
          npm install
          npm run build
          uv run wisk run check "$RUN" run-checks/verification verification 'uv sync --group dev; uv run wisk init .; npm install; npm run build; Wisk bundle validation' 'Environment synchronization, idempotent bootstrap, site build, and Wisk contract loading succeeded.' pass --goal "$GOAL" --evidence '.wisk/knowledge/local/'
          uv run wisk run goal-status "$RUN" "$GOAL" achieved
          uv run wisk run outcome "$RUN" run-outcomes/wisk-local-visual-contract success complete 'Wisk adoption now exposes Cobogó visual-lab specialization through the canonical local namespace.' 'Use uv run wisk start/session start-next on the next round; it should select the visual-explorer specialization when Experience is due.' --goals-advanced "$GOAL" --evidence run-evidence/local-specialization --checks run-checks/verification
          uv run wisk check "$RUN" | tee .wisk-check-final.json
          uv run wisk session next | tee .wisk-next-session.json
      - name: Persist completed Wisk state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .wisk .wisk-check-before-close.json .wisk-check-final.json .wisk-next-session.json uv.lock
          if git diff --cached --quiet; then
            echo 'No Wisk state changes to persist.'
            exit 0
          fi
          git commit -m 'chore(wisk): persist completed adoption experience'
          git push
