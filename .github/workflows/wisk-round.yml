name: Wisk round

on:
  push:
    branches:
      - wisk/round-20260907-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Sync project environment
        run: uv sync --group dev
      - name: Bootstrap Wisk idempotently
        run: uv run wisk init .
      - name: Start canonical Wisk round
        run: |
          set -o pipefail
          uv run wisk start | tee .wisk-start.txt
      - name: Persist Wisk state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .wisk .wisk-start.txt uv.lock
          if git diff --cached --quiet; then
            echo 'No Wisk state changes to persist.'
            exit 0
          fi
          git commit -m 'chore(wisk): persist round start state'
          git push
