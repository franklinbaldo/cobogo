name: Wisk round

on:
  push:
    branches:
      - wisk/round-20260907-next

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wisk/round-20260907-next
      - uses: astral-sh/setup-uv@v6
      - name: Sync project environment
        run: uv sync --group dev --locked
      - name: Bootstrap Wisk
        run: uv run wisk init .
      - name: Verify closed visual run
        shell: bash
        run: |
          uv run wisk check 'runs/20260907T180147Z-fa-a-o-melhor-avan-o-poss-vel-neste-reposit-rio' | tee /tmp/wisk-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/wisk-check.json').read_text())
          assert result['conformant'] is True, result
          assert result['unsatisfied'] == [], result
          print('Wisk run conformant')
          PY
