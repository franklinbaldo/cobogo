name: Patch Wisk round

on:
  push:
    branches: [wisk/round-20260907-02]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'patch-wisk-check-status')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Wisk 0.3 check vocabulary
        run: sed -i 's/ passed --goal/ pass --goal/g' .github/workflows/wisk-round.yml
      - name: Persist patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/wisk-round.yml
          git commit -m 'ci(wisk): use pass check status'
          git push
